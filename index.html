<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Test - 9 Levels Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #05050a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 15px;
        }
        h1 {
            font-size: 1.4rem;
            color: #ff2a85;
            text-align: center;
            text-shadow: 0 0 10px #ff2a85;
            margin-bottom: 3px;
        }
        p.subtitle {
            color: #00f0ff;
            margin-bottom: 12px;
            font-size: 0.8rem;
            text-align: center;
            text-shadow: 0 0 8px #00f0ff;
        }
        .rank-board {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            background: rgba(20, 20, 40, 0.8);
            border: 2px solid #00f0ff;
            padding: 8px 15px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
            width: 90%;
            max-width: 320px;
        }
        .rank-item {
            display: flex;
            justify-content: space-between;
        }
        .rank-pro { color: #39ff14; text-shadow: 0 0 5px #39ff14; font-weight: bold; }
        .rank-mid { color: #ffaa00; text-shadow: 0 0 5px #ffaa00; font-weight: bold; }
        
        .level-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 90%;
            max-width: 320px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #39ff14;
        }
        .level-title {
            color: #39ff14;
            font-weight: bold;
            font-size: 0.9rem;
            text-shadow: 0 0 5px #39ff14;
        }
        .level-btns button {
            background: #1a0033;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .level-btns button:hover {
            background: #00f0ff;
            color: #000;
        }

        #game-box {
            width: 90%;
            max-width: 320px;
            height: 200px;
            background-color: #1a0033;
            border: 3px solid #ff2a85;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 0 25px #ff2a85;
            transition: all 0.1s ease;
            text-align: center;
            padding: 15px;
        }
        #game-box:active {
            transform: scale(0.95);
        }
        .result-box {
            margin-top: 15px;
            font-size: 0.9rem;
            text-align: center;
            background: rgba(10, 10, 25, 0.8);
            border: 2px solid #39ff14;
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.3);
            width: 90%;
            max-width: 320px;
        }
        .result-box span {
            color: #39ff14;
            font-size: 1.1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>⚡ REACTION TEST PRO</h1>
    <p class="subtitle">9-Level Cyberpunk Challenge vs Nova</p>

    <!-- Rank Scale -->
    <div class="rank-board">
        <div class="rank-item"><span>0.00s - 0.25s</span> <span class="rank-pro">PRO 🏆</span></div>
        <div class="rank-item"><span>0.25s - 0.50s</span> <span class="rank-mid">MID ⚡</span></div>
    </div>

    <!-- Level Selector -->
    <div class="level-container">
        <span class="level-title" id="level-label">LEVEL 1 / 9</span>
        <div class="level-btns">
            <button onclick="changeLevel(-1)">◀</button>
            <button onclick="changeLevel(1)">▶</button>
        </div>
    </div>

    <div id="game-box">TAP TO START</div>

    <div class="result-box">
        <div>Time: <span id="time-display">0.00s</span> | Best: <span id="best-display" style="color:#00f0ff;">--</span></div>
        <div style="font-size: 0.8rem; color: #00f0ff; margin-top: 3px;" id="rank-result">Status: Ready</div>
    </div>

    <script>
        const gameBox = document.getElementById('game-box');
        const timeDisplay = document.getElementById('time-display');
        const bestDisplay = document.getElementById('best-display');
        const rankResult = document.getElementById('rank-result');
        const levelLabel = document.getElementById('level-label');

        let gameState = 'IDLE'; 
        let startTime, timeoutId;
        let currentLevel = 1;
        const maxLevels = 9;

        let bestScores = JSON.parse(localStorage.getItem('neonProBestScores')) || {};
        updateBestDisplay();

        function changeLevel(dir) {
            if (gameState !== 'IDLE') return;
            currentLevel += dir;
            if (currentLevel > maxLevels) currentLevel = 1;
            if (currentLevel < 1) currentLevel = maxLevels;
            
            levelLabel.innerText = `LEVEL ${currentLevel} / ${maxLevels}`;
            updateBestDisplay();
        }

        function updateBestDisplay() {
            const best = bestScores[currentLevel];
            bestDisplay.innerText = best ? best + 's' : '--';
        }

        gameBox.addEventListener('click', () => {
            if (gameState === 'IDLE') {
                startGame();
            } else if (gameState === 'WAITING') {
                clearTimeout(timeoutId);
                gameBox.style.backgroundColor = '#331a00';
                gameBox.style.borderColor = '#ffaa00';
                gameBox.style.boxShadow = '0 0 20px #ffaa00';
                gameBox.innerText = '⚠️️ FALSE START!\nBall missed!';
                rankResult.innerText = 'Status: False Start';
                gameState = 'IDLE';
            } else if (gameState === 'READY') {
                const reactionTimeSec = ((Date.now() - startTime) / 1000).toFixed(3);
                gameBox.style.backgroundColor = '#003311';
                gameBox.style.borderColor = '#39ff14';
                gameBox.style.boxShadow = '0 0 30px #39ff14';
                
                timeDisplay.innerText = reactionTimeSec + 's';

                // Save best score for this level
                if (!bestScores[currentLevel] || parseFloat(reactionTimeSec) < parseFloat(bestScores[currentLevel])) {
                    bestScores[currentLevel] = reactionTimeSec;
                    localStorage.setItem('neonProBestScores', JSON.stringify(bestScores));
                    bestDisplay.innerText = reactionTimeSec + 's';
                }

                if (reactionTimeSec <= 0.25) {
                    gameBox.innerText = `🏆 Lvl ${currentLevel} PRO!`;
                    rankResult.innerText = 'Status: PRO Level (Virat Level!)';
                    rankResult.style.color = '#39ff14';
                } else if (reactionTimeSec <= 0.50) {
                    gameBox.innerText = `⚡ Lvl ${currentLevel} MID!`;
                    rankResult.innerText = 'Status: MID Level';
                    rankResult.style.color = '#ffaa00';
                } else {
                    gameBox.innerText = `🐢 Lvl ${currentLevel} SLOW!`;
                    rankResult.innerText = 'Status: Needs Practice';
                    rankResult.style.color = '#ff2a85';
                }

                gameBox.innerHTML += '<br><span style="font-size:0.75rem; color:#fff;">Tap to Retry</span>';
                gameState = 'IDLE';
            }
        });

        function startGame() {
            gameBox.style.backgroundColor = '#33001a';
            gameBox.style.borderColor = '#ff2a85';
            gameBox.style.boxShadow = '0 0 25px #ff2a85';
            gameBox.innerText = '🔴 BALL INCOMING...\nWait for Green!';
            rankResult.innerText = 'Status: Watching...';
            rankResult.style.color = '#00f0ff';
            gameState = 'WAITING';

            // Level ke sath difficulty badhegi (Level 1 mein slow, Level 9 mein extreme fast!)
            let baseDelay = Math.max(300, 2000 - (currentLevel * 150));
            let randomSpan = Math.max(200, 1200 - (currentLevel * 90));
            const randomTime = Math.floor(Math.random() * randomSpan) + baseDelay;

            timeoutId = setTimeout(() => {
                gameBox.style.backgroundColor = '#001a33';
                gameBox.style.borderColor = '#00f0ff';
                gameBox.style.boxShadow = '0 0 35px #00f0ff';
                gameBox.innerText = '🟢 STOP IT NOW!';
                gameState = 'READY';
                startTime = Date.now();
            }, randomTime);
        }
    </script>
</body>
</html>
